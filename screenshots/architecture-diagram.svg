<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flight data pipeline architecture</title>
<desc>AviationStack API feeds Airflow on EC2, which loads raw data into S3 and Snowflake's medallion layers, ending in a Power BI dashboard. Airflow also sends failure alerts to Slack.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="280" fill="#ffffff"/>

<line x1="160" y1="98" x2="180" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="98" x2="320" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="98" x2="490" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240" y1="126" x2="240" y2="176" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>

<g>
  <rect x="40" y="70" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Flight API</text>
  <text x="100" y="108" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">AviationStack</text>
</g>

<g>
  <rect x="180" y="70" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="240" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#27500A">Airflow</text>
  <text x="240" y="108" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3B6D11">Docker on EC2</text>
</g>

<g>
  <rect x="320" y="70" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="395" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">S3 + Snowflake</text>
  <text x="395" y="108" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Medallion layers</text>
</g>

<g>
  <rect x="490" y="70" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="550" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Power BI</text>
  <text x="550" y="108" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Dashboard</text>
</g>

<g>
  <rect x="180" y="176" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="240" y="198" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#791F1F">Slack alert</text>
</g>

<text x="340" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Solid = data flow &#183; dashed = failure alert</text>
</svg>
